[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "unit: pure unit tests that do not require database setup",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/base.py",
    "app/models/__init__.py",
    "app/models/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
