name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # 1. Backend — lint, type-check, tests + coverage
  # -----------------------------------------------------------------------
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: desklite
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: desklite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desklite -d desklite_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://desklite:testpassword@localhost:5432/desklite_test
      JWT_SECRET: ci-test-secret-not-real
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: "15"
      REFRESH_TOKEN_DAYS: "7"
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: desklite-test
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      FRONTEND_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Tests + coverage
        run: pytest -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80

  # -----------------------------------------------------------------------
  # 2. Frontend — lint, type-check, build
  # -----------------------------------------------------------------------
  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # -----------------------------------------------------------------------
  # 3. Security — dependency vulnerability scan (both sides)
  # -----------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit Node dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
